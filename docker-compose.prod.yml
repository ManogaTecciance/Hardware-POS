# Hardware POS - production stack for a single Linux host (Tencent Lighthouse).
#
#   caddy  : public entrypoint. Terminates HTTPS (auto Let's Encrypt certs for
#            axlopos.com / www.axlopos.com / api.axlopos.com) and reverse-proxies
#            to web and api. Only 80/443 are open on the host firewall.
#   web    : Next.js front-end. Internal only, reachable via the compose network.
#   api    : NestJS. Internal only, never published to the host.
#   db     : PostgreSQL. Internal only, NO published port. The API reaches it as
#            host "db" on the private compose network.
#
# All configuration comes from .env.prod (see .env.prod.example). Every var,
# including the full DATABASE_URL and POSTGRES_PASSWORD, is injected into the
# containers via env_file, so there is no ${VAR} interpolation to trip over.
#
# NEXT_PUBLIC_API_URL is baked into the web bundle at build time (build.args
# below). Change it there and rebuild the web image; a restart is not enough.
#
# Bring up:   docker compose -f docker-compose.prod.yml up -d --build
# Logs:       docker compose -f docker-compose.prod.yml logs -f api
#
# Migrations are NOT applied automatically. Applying them is a deliberate,
# separately-approved step that must run BEFORE replicas are started/updated:
#   docker compose -f docker-compose.prod.yml run --rm api migrate
# See docs/restaurant-pos/06-migration-and-rollout.md for the full runbook.
#
# Resource limits are sized for a 2 vCPU / 4 GB host; raise them on bigger boxes.

services:
  caddy:
    image: caddy:2
    container_name: hardware-pos-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # issued certificates - persist this, it's the cert store
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.axlopos.com/v1
    container_name: hardware-pos-web
    restart: always
    environment:
      TZ: UTC
    security_opt:
      - no-new-privileges:true
    # The standalone server never writes to its own filesystem; keep it immutable.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # No "ports:" - only caddy reaches it.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hardware-pos-api
    restart: always
    env_file:
      - .env.prod
    environment:
      # Highest precedence - guarantees uploads land on the mounted volume
      # regardless of what .env.prod says.
      UPLOAD_DIR: /data/uploads
      # Datetimes are stored in UTC; the process zone must not be able to skew that.
      TZ: UTC
    volumes:
      - uploads_data:/data/uploads # local product images (or use STORAGE_PROVIDER=s3)
    security_opt:
      - no-new-privileges:true
    # Chromium (server-side PDF) needs writable scratch space and a larger /dev/shm.
    tmpfs:
      - /tmp
    shm_size: 256m
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "1.5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # No "ports:" - the API is never exposed to the host or the internet.

  db:
    image: postgres:16-alpine
    container_name: hardware-pos-db
    restart: always
    env_file:
      - .env.prod # provides POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    environment:
      # Timestamps are stored as UTC wall clocks; keep the server session in UTC
      # so psql/pg_dump and any non-Prisma reader interpret them the same way.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardware_pos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No "ports:" - DB is private to this network. Back it up with pg_dump.

volumes:
  caddy_data:
  caddy_config:
  uploads_data:
  pgdata:
