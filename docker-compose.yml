services:
  postgres:
    image: postgres:16-alpine
    container_name: hardware-pos-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hardware_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardware_pos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # S3 emulator for local development (product image uploads).
  # Pair with STORAGE_PROVIDER=s3 + S3_ENDPOINT=http://localhost:4566 in apps/api/.env.
  localstack:
    # Pinned to 4.x — the 2026 calendar-versioned releases require a LocalStack
    # account auth token even for the free tier; 4.x runs without one.
    image: localstack/localstack:4.0
    container_name: hardware-pos-localstack
    restart: always
    environment:
      SERVICES: s3
      # Object persistence across container re-creation is a LocalStack Pro
      # feature, so the community image starts EMPTY every time. The init
      # hook below re-creates the bucket on each start; without it the first
      # symptom is "The specified bucket does not exist" on an image upload,
      # from a part of the app that has nothing to do with Docker.
      UPLOADS_BUCKET: hardware-pos-uploads
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      # Runs once the S3 service reports ready — see the script's header.
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
  localstack_data:
